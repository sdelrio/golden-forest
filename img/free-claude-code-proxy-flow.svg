<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 912 1070" role="img" aria-labelledby="fcc-flow-title" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="fcc-flow-title">Architecture of Free Claude Code: the fcc-claude command starts Claude Code on the local machine, which sends Anthropic API calls to the local fcc-server proxy. The proxy translates the protocol and routes each request to a local LLM, a cloud API, or a high-speed router. Responses are converted back to Anthropic SSE events and streamed to Claude Code.</title>
  <defs>
    <marker id="fcc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#8b949e"/>
    </marker>
    <marker id="fcc-arrow-local" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#58a6ff"/>
    </marker>
  </defs>

  <rect width="912" height="1070" rx="18" fill="#0d1117"/>

  <text x="456" y="56" text-anchor="middle" font-size="24" font-weight="700" fill="#e6edf3">Free Claude Code - Request Pipeline</text>
  <text x="456" y="84" text-anchor="middle" font-size="14" fill="#8b949e">Claude Code keeps its Anthropic protocol; fcc-server translates to and from each provider.</text>

  <rect x="40" y="104" width="760" height="320" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="68" y="138" font-size="14" font-weight="600" letter-spacing="1" fill="#8b949e">Local Developer Machine</text>

  <rect x="200" y="158" width="440" height="54" rx="10" fill="#21262d" stroke="#30363d"/>
  <text x="420" y="191" text-anchor="middle" font-size="17" fill="#e6edf3">fcc-claude command</text>

  <line x1="420" y1="212" x2="420" y2="238" stroke="#8b949e" stroke-width="1.5" marker-end="url(#fcc-arrow)"/>
  <text x="436" y="230" font-size="14" fill="#8b949e">CLI environment</text>

  <rect x="200" y="242" width="440" height="62" rx="10" fill="#21262d" stroke="#30363d"/>
  <text x="420" y="268" text-anchor="middle" font-size="17" fill="#e6edf3">Claude Code Client</text>
  <text x="420" y="288" text-anchor="middle" font-size="14" fill="#8b949e">terminal, VS Code, JetBrains</text>

  <line x1="420" y1="304" x2="420" y2="330" stroke="#8b949e" stroke-width="1.5" marker-end="url(#fcc-arrow)"/>
  <text x="436" y="322" font-size="14" fill="#8b949e">Anthropic API calls</text>

  <rect x="200" y="334" width="440" height="66" rx="10" fill="#21262d" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="420" y="360" text-anchor="middle" font-size="17" fill="#e6edf3">fcc-server proxy</text>
  <text x="420" y="380" text-anchor="middle" font-size="14" fill="#8b949e">emulates /v1/messages and /v1/models</text>

  <path d="M200 352 H162 V273 H196" fill="none" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#fcc-arrow-local)"/>
  <text x="154" y="316" text-anchor="end" font-size="13" fill="#58a6ff">Local probes</text>

  <rect x="40" y="470" width="760" height="354" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="68" y="504" font-size="14" font-weight="600" letter-spacing="1" fill="#8b949e">Configured Upstream Provider</text>

  <line x1="420" y1="400" x2="420" y2="530" stroke="#8b949e" stroke-width="1.5" marker-end="url(#fcc-arrow)"/>
  <text x="436" y="466" font-size="14" fill="#8b949e">Translate protocol</text>

  <rect x="200" y="534" width="440" height="60" rx="10" fill="#21262d" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="420" y="560" text-anchor="middle" font-size="17" fill="#e6edf3">Provider selection</text>
  <text x="420" y="580" text-anchor="middle" font-size="14" fill="#8b949e">/admin route and tier mapping</text>

  <path d="M420 594 V628" fill="none" stroke="#8b949e" stroke-width="1.5"/>
  <line x1="176" y1="628" x2="664" y2="628" stroke="#8b949e" stroke-width="1.5"/>
  <line x1="176" y1="628" x2="176" y2="656" stroke="#8b949e" stroke-width="1.5" marker-end="url(#fcc-arrow)"/>
  <line x1="420" y1="628" x2="420" y2="656" stroke="#8b949e" stroke-width="1.5" marker-end="url(#fcc-arrow)"/>
  <line x1="664" y1="628" x2="664" y2="656" stroke="#8b949e" stroke-width="1.5" marker-end="url(#fcc-arrow)"/>
  <text x="184" y="646" font-size="13" fill="#58a6ff">Local LLM</text>
  <text x="428" y="646" font-size="13" fill="#3fb950">Cloud API</text>
  <text x="672" y="646" font-size="13" fill="#d29922">High-Speed API</text>

  <rect x="68" y="660" width="216" height="126" rx="10" fill="#21262d" stroke="#30363d"/>
  <text x="176" y="692" text-anchor="middle" font-size="15" font-weight="600" fill="#58a6ff">Local LLM</text>
  <text x="176" y="718" text-anchor="middle" font-size="14" fill="#e6edf3">Ollama</text>
  <text x="176" y="740" text-anchor="middle" font-size="14" fill="#e6edf3">llama.cpp</text>
  <text x="176" y="762" text-anchor="middle" font-size="14" fill="#e6edf3">LM Studio</text>

  <rect x="312" y="660" width="216" height="126" rx="10" fill="#21262d" stroke="#30363d"/>
  <text x="420" y="692" text-anchor="middle" font-size="15" font-weight="600" fill="#3fb950">Cloud API</text>
  <text x="420" y="718" text-anchor="middle" font-size="14" fill="#e6edf3">Google Gemini</text>
  <text x="420" y="740" text-anchor="middle" font-size="14" fill="#e6edf3">DeepSeek</text>
  <text x="420" y="762" text-anchor="middle" font-size="14" fill="#e6edf3">Mistral</text>

  <rect x="556" y="660" width="216" height="126" rx="10" fill="#21262d" stroke="#30363d"/>
  <text x="664" y="692" text-anchor="middle" font-size="15" font-weight="600" fill="#d29922">High-Speed Routers</text>
  <text x="664" y="718" text-anchor="middle" font-size="14" fill="#e6edf3">OpenRouter / NVIDIA NIM</text>
  <text x="664" y="740" text-anchor="middle" font-size="14" fill="#e6edf3">Groq</text>
  <text x="664" y="762" text-anchor="middle" font-size="14" fill="#e6edf3">Cerebras</text>

  <line x1="176" y1="786" x2="176" y2="812" stroke="#8b949e" stroke-width="1.5"/>
  <line x1="420" y1="786" x2="420" y2="812" stroke="#8b949e" stroke-width="1.5"/>
  <line x1="664" y1="786" x2="664" y2="812" stroke="#8b949e" stroke-width="1.5"/>
  <path d="M176 812 H850 V368 H640" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#fcc-arrow)"/>
  <text x="792" y="322" text-anchor="end" font-size="14" fill="#8b949e">Convert to Anthropic SSE</text>

  <rect x="40" y="880" width="760" height="130" rx="14" fill="#161b22" stroke="#30363d"/>
  <rect x="68" y="914" width="14" height="14" rx="4" fill="#58a6ff"/>
  <text x="92" y="926" font-size="14" fill="#e6edf3">Local</text>
  <rect x="176" y="914" width="14" height="14" rx="4" fill="#3fb950"/>
  <text x="200" y="926" font-size="14" fill="#e6edf3">Cloud API</text>
  <rect x="324" y="914" width="14" height="14" rx="4" fill="#d29922"/>
  <text x="348" y="926" font-size="14" fill="#e6edf3">High-Speed routers</text>
  <text x="68" y="968" font-size="14" fill="#8b949e">Requests travel down as Anthropic Messages API calls; the proxy answers trivial probes locally.</text>
  <text x="68" y="992" font-size="14" fill="#8b949e">Responses are converted back into Anthropic SSE events before reaching Claude Code.</text>
</svg>
