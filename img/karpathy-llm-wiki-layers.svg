<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 736" role="img" aria-labelledby="llm-wiki-layers-title" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="llm-wiki-layers-title">The three layers of an LLM wiki. A schema file such as CLAUDE.md or AGENTS.md tells the agent how the wiki is organized. Immutable raw sources - articles, papers, repos, images and transcripts - are read once by the agent. The agent's three operations are ingest, query and lint: ingest writes and updates wiki pages, query reads the index and files good answers back as pages, lint flags drift and stale claims. The wiki itself is LLM-owned Markdown: concept pages, entity pages, comparisons, index.md and log.md.</title>
  <defs>
    <marker id="wiki-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#8b949e"/>
    </marker>
    <marker id="wiki-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#58a6ff"/>
    </marker>
    <marker id="wiki-arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#d29922"/>
    </marker>
  </defs>

  <rect width="1280" height="736" rx="18" fill="#0d1117"/>

  <text x="640" y="52" text-anchor="middle" font-size="24" font-weight="700" fill="#e6edf3">The Three Layers of an LLM Wiki</text>
  <text x="640" y="80" text-anchor="middle" font-size="14" fill="#8b949e">Raw sources stay immutable, the agent writes the wiki, and one schema file tells it how.</text>

  <rect x="40" y="104" width="1200" height="96" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="68" y="134" font-size="13" font-weight="600" letter-spacing="1" fill="#8b949e">SCHEMA</text>
  <rect x="64" y="148" width="1152" height="36" rx="8" fill="#21262d" stroke="#30363d"/>
  <text x="88" y="172" font-size="15" fill="#e6edf3">CLAUDE.md / AGENTS.md - folder layout, page types, frontmatter, and the ingest / query / lint workflow</text>

  <line x1="550" y1="200" x2="550" y2="228" stroke="#8b949e" stroke-width="1.5" marker-end="url(#wiki-arrow)"/>
  <text x="562" y="222" font-size="11" fill="#8b949e">conventions</text>

  <rect x="40" y="232" width="280" height="464" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="64" y="264" font-size="13" font-weight="600" letter-spacing="1" fill="#8b949e">RAW SOURCES</text>
  <text x="64" y="286" font-size="12" fill="#8b949e">immutable, agent reads only</text>
  <rect x="64" y="304" width="232" height="46" rx="8" fill="#21262d" stroke="#30363d"/>
  <text x="80" y="333" font-size="14" fill="#e6edf3">Articles and posts</text>
  <rect x="64" y="362" width="232" height="46" rx="8" fill="#21262d" stroke="#30363d"/>
  <text x="80" y="391" font-size="14" fill="#e6edf3">Papers and reports</text>
  <rect x="64" y="420" width="232" height="46" rx="8" fill="#21262d" stroke="#30363d"/>
  <text x="80" y="449" font-size="14" fill="#e6edf3">Repos and datasets</text>
  <rect x="64" y="478" width="232" height="46" rx="8" fill="#21262d" stroke="#30363d"/>
  <text x="80" y="507" font-size="14" fill="#e6edf3">Images</text>
  <rect x="64" y="536" width="232" height="46" rx="8" fill="#21262d" stroke="#30363d"/>
  <text x="80" y="565" font-size="14" fill="#e6edf3">Transcripts and notes</text>
  <text x="64" y="616" font-size="12" fill="#8b949e">You curate these files. The agent</text>
  <text x="64" y="636" font-size="12" fill="#8b949e">only ever reads them.</text>

  <rect x="400" y="232" width="300" height="464" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="424" y="264" font-size="13" font-weight="600" letter-spacing="1" fill="#8b949e">AGENT OPERATIONS</text>
  <text x="424" y="286" font-size="12" fill="#8b949e">follows the schema</text>

  <rect x="424" y="304" width="252" height="96" rx="10" fill="#21262d" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="444" y="332" font-size="16" font-weight="600" fill="#e6edf3">Ingest</text>
  <text x="444" y="354" font-size="12" fill="#8b949e">reads a source, writes a summary,</text>
  <text x="444" y="372" font-size="12" fill="#8b949e">updates pages, logs the change</text>

  <rect x="424" y="424" width="252" height="96" rx="10" fill="#21262d" stroke="#30363d"/>
  <text x="444" y="452" font-size="16" font-weight="600" fill="#e6edf3">Query</text>
  <text x="444" y="474" font-size="12" fill="#8b949e">reads the index, opens pages,</text>
  <text x="444" y="492" font-size="12" fill="#8b949e">files answers back as pages</text>

  <rect x="424" y="544" width="252" height="96" rx="10" fill="#21262d" stroke="#30363d"/>
  <text x="444" y="572" font-size="16" font-weight="600" fill="#e6edf3">Lint</text>
  <text x="444" y="594" font-size="12" fill="#8b949e">contradictions, stale claims,</text>
  <text x="444" y="612" font-size="12" fill="#8b949e">orphans, missing cross-links</text>
  <text x="424" y="676" font-size="12" fill="#8b949e">Same agent, three workflows.</text>

  <rect x="840" y="232" width="400" height="464" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="864" y="264" font-size="13" font-weight="600" letter-spacing="1" fill="#8b949e">WIKI</text>
  <text x="864" y="286" font-size="12" fill="#8b949e">LLM-owned Markdown pages</text>

  <rect x="864" y="304" width="352" height="52" rx="8" fill="#21262d" stroke="#30363d"/>
  <text x="884" y="327" font-size="15" font-weight="600" fill="#e6edf3">Concept pages</text>
  <text x="884" y="344" font-size="12" fill="#8b949e">one idea, assembled from every source</text>
  <rect x="864" y="368" width="352" height="52" rx="8" fill="#21262d" stroke="#30363d"/>
  <text x="884" y="391" font-size="15" font-weight="600" fill="#e6edf3">Entity pages</text>
  <text x="884" y="408" font-size="12" fill="#8b949e">people, projects, products</text>
  <rect x="864" y="432" width="352" height="52" rx="8" fill="#21262d" stroke="#30363d"/>
  <text x="884" y="455" font-size="15" font-weight="600" fill="#e6edf3">Comparisons</text>
  <text x="884" y="472" font-size="12" fill="#8b949e">side by side, with sources</text>
  <rect x="864" y="496" width="352" height="52" rx="8" fill="#21262d" stroke="#30363d"/>
  <text x="884" y="519" font-size="15" font-weight="600" fill="#e6edf3">index.md</text>
  <text x="884" y="536" font-size="12" fill="#8b949e">catalog: one line per page</text>
  <rect x="864" y="560" width="352" height="52" rx="8" fill="#21262d" stroke="#30363d"/>
  <text x="884" y="583" font-size="15" font-weight="600" fill="#e6edf3">log.md</text>
  <text x="884" y="600" font-size="12" fill="#8b949e">append-only record of ingests</text>
  <text x="864" y="648" font-size="12" fill="#8b949e">A Git repo of Markdown: diffs,</text>
  <text x="864" y="668" font-size="12" fill="#8b949e">history and blame for free.</text>

  <line x1="320" y1="352" x2="420" y2="352" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#wiki-arrow-accent)"/>
  <text x="358" y="338" text-anchor="middle" font-size="12" fill="#58a6ff">read once</text>

  <line x1="700" y1="352" x2="836" y2="352" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#wiki-arrow-accent)"/>
  <text x="768" y="326" text-anchor="middle" font-size="12" fill="#58a6ff">writes and</text>
  <text x="768" y="342" text-anchor="middle" font-size="12" fill="#58a6ff">updates pages</text>

  <line x1="700" y1="472" x2="836" y2="472" stroke="#8b949e" stroke-width="1.5" marker-end="url(#wiki-arrow)"/>
  <text x="768" y="448" text-anchor="middle" font-size="11" fill="#8b949e">reads pages,</text>
  <text x="768" y="464" text-anchor="middle" font-size="11" fill="#8b949e">files answers back</text>

  <line x1="700" y1="592" x2="836" y2="592" stroke="#d29922" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#wiki-arrow-warn)"/>
  <text x="768" y="568" text-anchor="middle" font-size="11" fill="#d29922">flags drift,</text>
  <text x="768" y="584" text-anchor="middle" font-size="11" fill="#d29922">stale claims</text>
</svg>
