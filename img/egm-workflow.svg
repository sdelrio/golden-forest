<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1000" role="img" aria-labelledby="egm-title egm-desc" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="egm-title">Elephant-Goldfish Model workflow: the elephant drafts with full context, goldfish review the concept and the design in isolated contexts, a human approves the design, then implementation and drift reports feed back into the spec.</title>
  <desc id="egm-desc">A vertical pipeline. egm-brainstorm writes a brief, which goes to a six-lens goldfish critique. The agreed direction feeds egm-draft, which writes the design doc. Five goldfish review stages run in fresh contexts: Initial Zoom Out, Comprehension, Design Critique, Intermediate Zoom Out, and Implementation Readiness. A synthesizer collects their findings. You resolve trade-offs and the design merges as a PR. Implementation follows, and egm-drift-report later compares the design docs with the current source, feeding back into the draft. Blue boxes are the elephant, amber boxes are goldfish, green boxes are the human gate.</desc>
  <defs>
    <marker id="egm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#8b949e"/>
    </marker>
    <marker id="egm-arrow-loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#a371f7"/>
    </marker>
  </defs>

  <rect width="1240" height="1000" rx="18" fill="#0d1117"/>

  <text x="620" y="48" text-anchor="middle" font-size="24" font-weight="700" fill="#e6edf3">Elephant-Goldfish Model</text>
  <text x="620" y="76" text-anchor="middle" font-size="14" fill="#8b949e">One agent drafts with full context. Fresh agents review it. You decide.</text>

  <!-- Elephant: brainstorm -->
  <rect x="340" y="104" width="560" height="64" rx="10" fill="#21262d" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="620" y="130" text-anchor="middle" font-size="16" fill="#e6edf3">egm-brainstorm</text>
  <text x="620" y="150" text-anchor="middle" font-size="12" fill="#8b949e">test the idea, write a brief</text>

  <line x1="620" y1="168" x2="620" y2="198" stroke="#8b949e" stroke-width="1.5" marker-end="url(#egm-arrow)"/>
  <text x="632" y="188" font-size="11" fill="#8b949e">brief only</text>

  <!-- Goldfish: concept critique -->
  <rect x="340" y="204" width="560" height="64" rx="10" fill="#21262d" stroke="#d29922" stroke-width="1.5"/>
  <text x="620" y="230" text-anchor="middle" font-size="16" fill="#e6edf3">Six-lens critique</text>
  <text x="620" y="250" text-anchor="middle" font-size="12" fill="#8b949e">of the concept, before any design work</text>

  <line x1="620" y1="268" x2="620" y2="298" stroke="#8b949e" stroke-width="1.5" marker-end="url(#egm-arrow)"/>
  <text x="632" y="288" font-size="11" fill="#8b949e">agreed direction</text>

  <!-- Elephant: draft -->
  <rect x="340" y="304" width="560" height="64" rx="10" fill="#21262d" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="620" y="330" text-anchor="middle" font-size="16" fill="#e6edf3">egm-draft</text>
  <text x="620" y="350" text-anchor="middle" font-size="12" fill="#8b949e">design doc, section by section</text>

  <path d="M620 368 V386 H196 V396" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#egm-arrow)"/>
  <text x="632" y="380" font-size="11" fill="#8b949e">document plus referenced files only</text>

  <!-- Goldfish: five review stages, each a fresh context -->
  <rect x="101" y="404" width="190" height="76" rx="10" fill="#21262d" stroke="#d29922" stroke-width="1.5"/>
  <text x="196" y="430" text-anchor="middle" font-size="11" letter-spacing="1" fill="#8b949e">STAGE 1</text>
  <text x="196" y="456" text-anchor="middle" font-size="13" fill="#e6edf3">Initial Zoom Out</text>

  <line x1="293" y1="442" x2="309" y2="442" stroke="#8b949e" stroke-width="1.5" marker-end="url(#egm-arrow)"/>

  <rect x="313" y="404" width="190" height="76" rx="10" fill="#21262d" stroke="#d29922" stroke-width="1.5"/>
  <text x="408" y="430" text-anchor="middle" font-size="11" letter-spacing="1" fill="#8b949e">STAGE 2</text>
  <text x="408" y="456" text-anchor="middle" font-size="13" fill="#e6edf3">Comprehension</text>

  <line x1="505" y1="442" x2="521" y2="442" stroke="#8b949e" stroke-width="1.5" marker-end="url(#egm-arrow)"/>

  <rect x="525" y="404" width="190" height="76" rx="10" fill="#21262d" stroke="#d29922" stroke-width="1.5"/>
  <text x="620" y="430" text-anchor="middle" font-size="11" letter-spacing="1" fill="#8b949e">STAGE 3</text>
  <text x="620" y="456" text-anchor="middle" font-size="13" fill="#e6edf3">Design Critique</text>

  <line x1="717" y1="442" x2="733" y2="442" stroke="#8b949e" stroke-width="1.5" marker-end="url(#egm-arrow)"/>

  <rect x="737" y="404" width="190" height="76" rx="10" fill="#21262d" stroke="#d29922" stroke-width="1.5"/>
  <text x="832" y="430" text-anchor="middle" font-size="11" letter-spacing="1" fill="#8b949e">STAGE 4</text>
  <text x="832" y="450" text-anchor="middle" font-size="13" fill="#e6edf3">Intermediate</text>
  <text x="832" y="468" text-anchor="middle" font-size="13" fill="#e6edf3">Zoom Out</text>

  <line x1="929" y1="442" x2="945" y2="442" stroke="#8b949e" stroke-width="1.5" marker-end="url(#egm-arrow)"/>

  <rect x="949" y="404" width="190" height="76" rx="10" fill="#21262d" stroke="#d29922" stroke-width="1.5"/>
  <text x="1044" y="430" text-anchor="middle" font-size="11" letter-spacing="1" fill="#8b949e">STAGE 5</text>
  <text x="1044" y="450" text-anchor="middle" font-size="13" fill="#e6edf3">Implementation</text>
  <text x="1044" y="468" text-anchor="middle" font-size="13" fill="#e6edf3">Readiness</text>

  <path d="M1044 480 V495 H620 V502" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#egm-arrow)"/>

  <!-- Goldfish: synthesizer -->
  <rect x="340" y="510" width="560" height="64" rx="10" fill="#21262d" stroke="#d29922" stroke-width="1.5"/>
  <text x="620" y="536" text-anchor="middle" font-size="16" fill="#e6edf3">Synthesizer</text>
  <text x="620" y="556" text-anchor="middle" font-size="12" fill="#8b949e">findings go to files, not chat</text>

  <line x1="620" y1="574" x2="620" y2="592" stroke="#8b949e" stroke-width="1.5" marker-end="url(#egm-arrow)"/>
  <text x="632" y="587" font-size="11" fill="#8b949e">findings, not decisions</text>

  <!-- Human gate -->
  <rect x="340" y="600" width="560" height="64" rx="10" fill="#21262d" stroke="#3fb950" stroke-width="1.5"/>
  <text x="620" y="626" text-anchor="middle" font-size="16" fill="#e6edf3">Resolve trade-offs</text>
  <text x="620" y="646" text-anchor="middle" font-size="12" fill="#8b949e">you decide what actually changes</text>

  <line x1="620" y1="664" x2="620" y2="682" stroke="#8b949e" stroke-width="1.5" marker-end="url(#egm-arrow)"/>

  <rect x="340" y="690" width="560" height="56" rx="10" fill="#21262d" stroke="#3fb950" stroke-width="1.5"/>
  <text x="620" y="724" text-anchor="middle" font-size="15" fill="#e6edf3">Design merged as a PR</text>

  <line x1="620" y1="746" x2="620" y2="764" stroke="#8b949e" stroke-width="1.5" marker-end="url(#egm-arrow)"/>

  <!-- Implementation -->
  <rect x="340" y="772" width="560" height="64" rx="10" fill="#21262d" stroke="#8b949e" stroke-width="1.5"/>
  <text x="620" y="798" text-anchor="middle" font-size="16" fill="#e6edf3">Implementation</text>
  <text x="620" y="818" text-anchor="middle" font-size="12" fill="#8b949e">code changes against an approved design</text>

  <line x1="620" y1="836" x2="620" y2="854" stroke="#8b949e" stroke-width="1.5" marker-end="url(#egm-arrow)"/>

  <!-- Maintenance -->
  <rect x="340" y="862" width="560" height="64" rx="10" fill="#21262d" stroke="#a371f7" stroke-width="1.5"/>
  <text x="620" y="888" text-anchor="middle" font-size="16" fill="#e6edf3">egm-drift-report</text>
  <text x="620" y="908" text-anchor="middle" font-size="12" fill="#8b949e">design docs versus current source</text>

  <path d="M900 894 H1170 Q1190 894 1190 874 V356 Q1190 336 1170 336 H912" fill="none" stroke="#a371f7" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#egm-arrow-loop)"/>
  <text x="1045" y="328" text-anchor="middle" font-size="11" fill="#a371f7">refresh the spec</text>

  <!-- Legend -->
  <rect x="340" y="952" width="22" height="12" rx="3" fill="#21262d" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="372" y="962" font-size="11.5" fill="#8b949e">Elephant: full project context</text>

  <rect x="580" y="952" width="22" height="12" rx="3" fill="#21262d" stroke="#d29922" stroke-width="1.5"/>
  <text x="612" y="962" font-size="11.5" fill="#8b949e">Goldfish: fresh context per stage</text>

  <rect x="860" y="952" width="22" height="12" rx="3" fill="#21262d" stroke="#3fb950" stroke-width="1.5"/>
  <text x="892" y="962" font-size="11.5" fill="#8b949e">Human: goals and constraints</text>
</svg>
