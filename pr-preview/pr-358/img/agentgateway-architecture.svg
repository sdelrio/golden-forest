<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="agw-arch-title" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="agw-arch-title">Agentgateway architecture: agent clients, application SDKs and other agents send MCP, A2A or HTTP traffic into the agentgateway data plane, which runs listeners, routes with CEL policies and authN/authZ once, then branches into an MCP multiplexer that federates tools and an LLM router that manages providers and budgets. The gateway fans out to upstream MCP servers over stdio, HTTP or SSE, OpenAPI backends exposed as tools, OpenAI-compatible LLM providers and A2A agents, and exports metrics, logs and traces over OTLP.</title>
  <defs>
    <marker id="agw-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#8b949e"/>
    </marker>
    <marker id="agw-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#58a6ff"/>
    </marker>
  </defs>

  <rect width="1200" height="720" rx="18" fill="#0d1117"/>

  <text x="600" y="50" text-anchor="middle" font-size="24" font-weight="700" fill="#e6edf3">Agentgateway - Architecture</text>
  <text x="600" y="80" text-anchor="middle" font-size="14" fill="#8b949e">One data plane terminates policy once, then fans out to MCP servers, REST APIs, LLM providers and A2A agents.</text>

  <rect x="40" y="104" width="250" height="360" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="64" y="134" font-size="13" font-weight="600" letter-spacing="1" fill="#8b949e">CLIENTS - MCP / A2A / HTTP</text>

  <rect x="64" y="152" width="202" height="84" rx="10" fill="#21262d" stroke="#30363d"/>
  <text x="165" y="182" text-anchor="middle" font-size="15" fill="#e6edf3">Agent clients</text>
  <text x="165" y="204" text-anchor="middle" font-size="13" fill="#8b949e">Claude Code, Cursor</text>
  <text x="165" y="222" text-anchor="middle" font-size="13" fill="#8b949e">OpenCode</text>

  <rect x="64" y="252" width="202" height="84" rx="10" fill="#21262d" stroke="#30363d"/>
  <text x="165" y="282" text-anchor="middle" font-size="15" fill="#e6edf3">Application SDKs</text>
  <text x="165" y="304" text-anchor="middle" font-size="13" fill="#8b949e">OpenAI-compatible</text>

  <rect x="64" y="352" width="202" height="84" rx="10" fill="#21262d" stroke="#30363d"/>
  <text x="165" y="382" text-anchor="middle" font-size="15" fill="#e6edf3">Other agents</text>
  <text x="165" y="404" text-anchor="middle" font-size="13" fill="#8b949e">A2A peers</text>

  <rect x="330" y="104" width="440" height="516" rx="14" fill="#161b22" stroke="#30363d"/>
  <line x1="292" y1="178" x2="348" y2="178" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#agw-arrow-accent)"/>
  <text x="354" y="134" font-size="13" font-weight="600" letter-spacing="1" fill="#8b949e">AGENTGATEWAY</text>

  <rect x="354" y="152" width="392" height="52" rx="10" fill="#21262d" stroke="#30363d"/>
  <text x="378" y="175" font-size="15" fill="#e6edf3">Listeners</text>
  <text x="378" y="193" font-size="13" fill="#8b949e">HTTP / TLS / CORS</text>

  <line x1="550" y1="204" x2="550" y2="222" stroke="#8b949e" stroke-width="1.5" marker-end="url(#agw-arrow)"/>

  <rect x="354" y="228" width="392" height="52" rx="10" fill="#21262d" stroke="#30363d"/>
  <text x="378" y="251" font-size="15" fill="#e6edf3">Routes and CEL policies</text>
  <text x="378" y="269" font-size="13" fill="#8b949e">per-route limits, rewrites, failover</text>

  <line x1="550" y1="280" x2="550" y2="298" stroke="#8b949e" stroke-width="1.5" marker-end="url(#agw-arrow)"/>

  <rect x="354" y="304" width="392" height="52" rx="10" fill="#21262d" stroke="#30363d"/>
  <text x="378" y="327" font-size="15" fill="#e6edf3">AuthN / AuthZ</text>
  <text x="378" y="345" font-size="13" fill="#8b949e">JWT, OAuth, API keys, mTLS</text>

  <path d="M550 356 V382 M448 382 H652" fill="none" stroke="#8b949e" stroke-width="1.5"/>
  <line x1="448" y1="382" x2="448" y2="400" stroke="#8b949e" stroke-width="1.5" marker-end="url(#agw-arrow)"/>
  <line x1="652" y1="382" x2="652" y2="400" stroke="#8b949e" stroke-width="1.5" marker-end="url(#agw-arrow)"/>
  <text x="560" y="376" font-size="11" fill="#8b949e">authorize once</text>

  <rect x="354" y="404" width="188" height="72" rx="10" fill="#21262d" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="448" y="428" text-anchor="middle" font-size="15" fill="#e6edf3">MCP multiplexer</text>
  <text x="448" y="448" text-anchor="middle" font-size="13" fill="#8b949e">tool federation</text>
  <text x="448" y="466" text-anchor="middle" font-size="13" fill="#8b949e">stdio / HTTP / SSE</text>

  <rect x="558" y="404" width="188" height="72" rx="10" fill="#21262d" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="652" y="428" text-anchor="middle" font-size="15" fill="#e6edf3">LLM router</text>
  <text x="652" y="448" text-anchor="middle" font-size="13" fill="#8b949e">providers, budgets</text>
  <text x="652" y="466" text-anchor="middle" font-size="13" fill="#8b949e">failover, token limits</text>

  <rect x="354" y="540" width="392" height="44" rx="10" fill="#21262d" stroke="#30363d" stroke-dasharray="5 4"/>
  <text x="550" y="567" text-anchor="middle" font-size="13" fill="#8b949e">Observability - metrics, logs, traces (OTLP)</text>

  <rect x="880" y="104" width="280" height="516" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="904" y="134" font-size="13" font-weight="600" letter-spacing="1" fill="#8b949e">UPSTREAMS</text>
  <text x="904" y="152" font-size="11" fill="#8b949e">MCP, REST, OpenAI-compatible, A2A</text>

  <rect x="904" y="168" width="232" height="72" rx="10" fill="#21262d" stroke="#30363d"/>
  <text x="928" y="198" font-size="15" fill="#58a6ff">MCP servers</text>
  <text x="928" y="220" font-size="13" fill="#e6edf3">stdio / HTTP / SSE</text>

  <rect x="904" y="268" width="232" height="72" rx="10" fill="#21262d" stroke="#30363d"/>
  <text x="928" y="298" font-size="15" fill="#3fb950">OpenAPI backends</text>
  <text x="928" y="320" font-size="13" fill="#e6edf3">REST endpoints as tools</text>

  <rect x="904" y="368" width="232" height="72" rx="10" fill="#21262d" stroke="#30363d"/>
  <text x="928" y="398" font-size="15" fill="#d29922">LLM providers</text>
  <text x="928" y="420" font-size="13" fill="#e6edf3">OpenAI-compatible APIs</text>

  <rect x="904" y="468" width="232" height="72" rx="10" fill="#21262d" stroke="#30363d"/>
  <text x="928" y="498" font-size="15" fill="#bc8cff">A2A agents</text>
  <text x="928" y="520" font-size="13" fill="#e6edf3">agent-to-agent calls</text>

  <path d="M770 440 L896 204" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#agw-arrow)"/>
  <path d="M770 440 L896 304" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#agw-arrow)"/>
  <path d="M770 440 L896 404" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#agw-arrow)"/>
  <path d="M770 440 L896 504" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#agw-arrow)"/>

  <text x="40" y="660" font-size="14" fill="#8b949e">Clients speak MCP, A2A or plain HTTP; the gateway terminates policy once and fans out to every backend type.</text>
  <text x="40" y="684" font-size="14" fill="#8b949e">MCP sessions are multiplexed upstream, so one client connection reaches many servers without per-server config.</text>
</svg>
