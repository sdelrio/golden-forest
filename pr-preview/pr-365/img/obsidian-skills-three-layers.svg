<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 736" role="img" aria-labelledby="obsidian-layers-title" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="obsidian-layers-title">The layers of an LLM wiki, and the schema that governs them. A schema file such as CLAUDE.md or AGENTS.md governs the whole system. Immutable raw sources - articles, web clips, daily session logs, meeting notes and images - are read but never edited. A compiler layer, triggered by session lifecycle hooks, turns new session logs into knowledge. The wiki is LLM-owned Markdown: an index, a log, source summaries, entity pages and concept pages.</title>
  <defs>
    <marker id="ol-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#8b949e"/>
    </marker>
    <marker id="ol-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#58a6ff"/>
    </marker>
  </defs>

  <rect width="1280" height="736" rx="18" fill="#0d1117"/>

  <text x="640" y="52" text-anchor="middle" font-size="24" font-weight="700" fill="#e6edf3">The Layers of an LLM Wiki</text>
  <text x="640" y="80" text-anchor="middle" font-size="14" fill="#8b949e">Raw sources stay immutable, a compiler turns sessions into pages, and one schema file governs both.</text>

  <rect x="40" y="104" width="1200" height="96" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="68" y="134" font-size="13" font-weight="600" letter-spacing="1" fill="#8b949e">SCHEMA</text>
  <rect x="64" y="148" width="1152" height="36" rx="8" fill="#21262d" stroke="#30363d"/>
  <text x="88" y="172" font-size="15" fill="#e6edf3">CLAUDE.md / AGENTS.md - folder layout, page types, frontmatter, and the ingest / query / lint workflow</text>

  <line x1="550" y1="200" x2="550" y2="228" stroke="#8b949e" stroke-width="1.5" marker-end="url(#ol-arrow)"/>
  <text x="562" y="222" font-size="11" fill="#8b949e">governs</text>

  <rect x="40" y="232" width="280" height="464" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="64" y="264" font-size="13" font-weight="600" letter-spacing="1" fill="#8b949e">RAW SOURCES</text>
  <text x="64" y="286" font-size="12" fill="#8b949e">immutable, agent reads only</text>
  <rect x="64" y="304" width="232" height="46" rx="8" fill="#21262d" stroke="#30363d"/>
  <text x="80" y="333" font-size="14" fill="#e6edf3">Articles and papers</text>
  <rect x="64" y="362" width="232" height="46" rx="8" fill="#21262d" stroke="#30363d"/>
  <text x="80" y="391" font-size="14" fill="#e6edf3">Web clips</text>
  <rect x="64" y="420" width="232" height="46" rx="8" fill="#21262d" stroke="#30363d"/>
  <text x="80" y="449" font-size="14" fill="#e6edf3">Daily session logs</text>
  <rect x="64" y="478" width="232" height="46" rx="8" fill="#21262d" stroke="#30363d"/>
  <text x="80" y="507" font-size="14" fill="#e6edf3">Meeting notes</text>
  <rect x="64" y="536" width="232" height="46" rx="8" fill="#21262d" stroke="#30363d"/>
  <text x="80" y="565" font-size="14" fill="#e6edf3">Images and data</text>
  <text x="64" y="616" font-size="12" fill="#8b949e">You curate these files. The agent</text>
  <text x="64" y="636" font-size="12" fill="#8b949e">only ever reads them.</text>

  <rect x="400" y="232" width="300" height="464" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="424" y="264" font-size="13" font-weight="600" letter-spacing="1" fill="#8b949e">EVOLUTION</text>
  <text x="424" y="286" font-size="12" fill="#8b949e">compiler, fired by hook events</text>

  <rect x="424" y="304" width="252" height="64" rx="10" fill="#21262d" stroke="#30363d"/>
  <text x="444" y="328" font-size="14" font-weight="600" fill="#e6edf3">SessionStart</text>
  <text x="444" y="348" font-size="12" fill="#8b949e">loads the index and pages</text>

  <rect x="424" y="380" width="252" height="64" rx="10" fill="#21262d" stroke="#30363d"/>
  <text x="444" y="404" font-size="14" font-weight="600" fill="#e6edf3">PreCompact</text>
  <text x="444" y="424" font-size="12" fill="#8b949e">summarizes the session</text>

  <rect x="424" y="456" width="252" height="64" rx="10" fill="#21262d" stroke="#30363d"/>
  <text x="444" y="480" font-size="14" font-weight="600" fill="#e6edf3">SessionEnd</text>
  <text x="444" y="500" font-size="12" fill="#8b949e">archives to raw/daily_logs</text>

  <rect x="424" y="532" width="252" height="64" rx="10" fill="#21262d" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="444" y="556" font-size="14" font-weight="600" fill="#e6edf3">Compiler pass</text>
  <text x="444" y="576" font-size="12" fill="#8b949e">rewrites pages, index, log</text>
  <text x="424" y="636" font-size="12" fill="#8b949e">Session history is the source</text>
  <text x="424" y="656" font-size="12" fill="#8b949e">code. The wiki is the build.</text>

  <rect x="840" y="232" width="400" height="464" rx="14" fill="#161b22" stroke="#30363d"/>
  <text x="864" y="264" font-size="13" font-weight="600" letter-spacing="1" fill="#8b949e">WIKI</text>
  <text x="864" y="286" font-size="12" fill="#8b949e">LLM-owned Markdown pages</text>
  <rect x="864" y="304" width="352" height="52" rx="8" fill="#21262d" stroke="#30363d"/>
  <text x="884" y="327" font-size="15" font-weight="600" fill="#e6edf3">index.md</text>
  <text x="884" y="344" font-size="12" fill="#8b949e">catalog: one line per page</text>
  <rect x="864" y="368" width="352" height="52" rx="8" fill="#21262d" stroke="#30363d"/>
  <text x="884" y="391" font-size="15" font-weight="600" fill="#e6edf3">log.md</text>
  <text x="884" y="408" font-size="12" fill="#8b949e">append-only history of ingests</text>
  <rect x="864" y="432" width="352" height="52" rx="8" fill="#21262d" stroke="#30363d"/>
  <text x="884" y="455" font-size="15" font-weight="600" fill="#e6edf3">Source summaries</text>
  <text x="884" y="472" font-size="12" fill="#8b949e">one page per ingested source</text>
  <rect x="864" y="496" width="352" height="52" rx="8" fill="#21262d" stroke="#30363d"/>
  <text x="884" y="519" font-size="15" font-weight="600" fill="#e6edf3">Entity pages</text>
  <text x="884" y="536" font-size="12" fill="#8b949e">people, tools, projects</text>
  <rect x="864" y="560" width="352" height="52" rx="8" fill="#21262d" stroke="#30363d"/>
  <text x="884" y="583" font-size="15" font-weight="600" fill="#e6edf3">Concept pages</text>
  <text x="884" y="600" font-size="12" fill="#8b949e">one idea, stitched from all sources</text>
  <text x="864" y="648" font-size="12" fill="#8b949e">A Git repo of Markdown: diffs,</text>
  <text x="864" y="668" font-size="12" fill="#8b949e">history and blame for free.</text>

  <line x1="320" y1="464" x2="396" y2="464" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#ol-arrow-accent)"/>
  <text x="358" y="450" text-anchor="middle" font-size="11" fill="#58a6ff">new logs</text>

  <line x1="700" y1="464" x2="836" y2="464" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#ol-arrow-accent)"/>
  <text x="768" y="442" text-anchor="middle" font-size="11" fill="#58a6ff">writes and</text>
  <text x="768" y="456" text-anchor="middle" font-size="11" fill="#58a6ff">updates pages</text>
</svg>
